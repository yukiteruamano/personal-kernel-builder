# personal-kernel-builder settings: KEY=VALUE, one per line, no shell code.
# Quotes are optional. Command-line options (--jobs, --initrd) override these values.

# Kernel name: releases end in -NAME (e.g. 7.3.3-volfread). Changing it needs a rebuild.
NAME=volfread

# Slackware's kernel-source tree (only read; builds run in a copy under BUILD_ROOT)
SRC_DIR=/usr/src/linux
# Private build directories (BUILD_ROOT/personal-kernel-builder-<user>), wiped at reboot
BUILD_ROOT=/tmp
JOBS=4

# personal.config backups and build logs kept
KEEP_BACKUPS=7
KEEP_LOGS=7

# User who owns personal.config and its backups, and whose build install takes
# (empty: init uses the user who logged in before su, or --builder USER)
BUILDER=

# initrd: no means nvme/xfs are built in and GRUB_DISABLE_LINUX_UUID=true
USE_INITRD=no
RESUME_DEV=/dev/nvme0n1p2
# Root filesystem UUID for the initrd (empty: UUID of /)
ROOT_UUID=

# GRUB_TIMEOUT install requires, so Slackware's kernel stays reachable
GRUB_MIN_TIMEOUT=3

# Options the kernel must have: NAME means y or m, NAME=y means built in
# (nvme/xfs/efi must be built in to boot without initrd)
CRITICAL_OPTIONS=EFI_STUB=y BLK_DEV_NVME=y XFS_FS=y ACPI=y ACPI_EC=y ACPI_AC ACPI_BATTERY POWER_SUPPLY THINKPAD_ACPI TYPEC_UCSI UCSI_ACPI AMD_PMC PINCTRL_AMD MODULE_SIG

# What verify checks in the running kernel (amd_pmc is skipped without its ACPI device)
VERIFY_MODULES=thinkpad_acpi ucsi_acpi amd_pmc
VERIFY_BATTERY=yes
