# personal-kernel-builder settings: KEY=VALUE, one per line, no shell code.
# Quotes are optional. Command-line options (--jobs, --initrd) override these values.

# Kernel name: releases end in -NAME (7.3.3-NAME). init --name sets it; changing it
# needs a rebuild.
NAME=

# Slackware's kernel-source tree (only read; builds run in a copy under BUILD_ROOT)
SRC_DIR=/usr/src/linux
# Private build directories (BUILD_ROOT/personal-kernel-builder-<user>), wiped at reboot
BUILD_ROOT=/tmp
JOBS=4

# personal.config backups and build logs kept
KEEP_BACKUPS=7
KEEP_LOGS=7

# User who owns personal.config and its backups, and whose build install takes
# (empty: init uses the user who logged in before su, or --builder USER)
BUILDER=

# initrd: no means the root disk and filesystem drivers are built in (see CRITICAL_OPTIONS)
# and GRUB_DISABLE_LINUX_UUID=true
USE_INITRD=no
# Hibernation resume device for the initrd, such as /dev/nvme0n1p2 (empty: none)
RESUME_DEV=
# Root filesystem UUID for the initrd (empty: UUID of /)
ROOT_UUID=

# GRUB_TIMEOUT install requires, so Slackware's kernel stays reachable
GRUB_MIN_TIMEOUT=3

# Options the kernel must have: NAME means y or m, NAME=y means built in. Without an
# initrd, add the root disk and filesystem drivers as =y (BLK_DEV_NVME=y XFS_FS=y, say)
# and the machine's essentials: the README lists them for each seed config
CRITICAL_OPTIONS=EFI_STUB=y MODULES=y MODULE_SIG

# What verify checks in the running kernel: modules that must be loaded (amd_pmc is
# skipped without its ACPI device) and, on laptops, why BAT0 is not charging
VERIFY_MODULES=
VERIFY_BATTERY=no
